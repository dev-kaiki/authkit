# Só o Postgres: esta API não usa Redis nem armazenamento de objetos. O
# template trazia os dois, e o minio ainda por cima quebrava `docker compose
# up` inteiro, porque a imagem saiu do Docker Hub.
#
# Sem container_name: o Compose nomeia por projeto (authkit-postgres-1), então
# este repo não briga por nome com outro clone do mesmo template.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d app']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
