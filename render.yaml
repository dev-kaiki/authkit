# Blueprint do Render: cria a API e o Postgres que ela usa.
#
# O que continua sendo manual (sync: false) é o que o Render não tem como
# adivinhar: o segredo do JWT, a origem do front e as credenciais do primeiro
# admin.
databases:
  - name: dev-kaiki-authkit-db
    databaseName: authkit
    user: authkit
    plan: free
    region: oregon

services:
  - type: web
    name: dev-kaiki-authkit-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeploy: true
    healthCheckPath: /health

    buildCommand: |
      corepack enable
      pnpm install --frozen-lockfile
      pnpm --filter api exec prisma generate
      pnpm --filter api build

    preDeployCommand: |
      pnpm --filter api exec prisma migrate deploy

    startCommand: pnpm --filter api start:prod

    envVars:
      - key: NODE_ENV
        value: production

      # Ligado ao banco acima: o Render injeta a URL, não precisa colar.
      - key: DATABASE_URL
        fromDatabase:
          name: dev-kaiki-authkit-db
          property: connectionString

      # Gerado pelo Render no primeiro deploy e mantido depois.
      - key: JWT_SECRET
        generateValue: true

      # A URL do front na Vercel. A API se recusa a subir sem isso em
      # produção, porque sem lista de origens o CORS aceitaria qualquer site.
      - key: CORS_ORIGIN
        sync: false

      # Usadas só se você rodar o seed do primeiro admin.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
